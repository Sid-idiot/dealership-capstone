<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Dealership</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Dealership</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/About.html">About Us</a>
            <a class="nav-link active" href="/Contact.html">Contact Us</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h1>Contact Us</h1>
    <div class="mb-4">
    <img
        src="https://images.unsplash.com/photo-1560179707-f14e90ef3623?w=1200"
        class="img-fluid rounded"
        alt="Dealership showroom">
</div>
    <p>We would be happy to hear from you.</p>

    <div class="card p-4 mt-4">
        <h3>Dealership Support</h3>
        <p><strong>Address:</strong> 100 Main Street, Chicago, IL</p>
        <p><strong>Phone:</strong> +1 800-555-0100</p>
        <p><strong>Email:</strong> support@dealership.example</p>
        <p><strong>Hours:</strong> Monday - Friday, 9:00 AM - 6:00 PM</p>
    </div>

    <form class="mt-4">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="5"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
</div>

</body>
</html>
