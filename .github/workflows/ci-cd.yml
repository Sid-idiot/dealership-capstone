name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Project structure check
        run: |
          test -f server/manage.py
          test -f server/frontend/static/About.html
          test -f server/frontend/static/Contact.html
          test -f server/frontend/src/components/Register/Register.jsx

      - name: CI/CD completed
        run: echo "Dealership capstone workflow completed"
